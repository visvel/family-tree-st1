<!DOCTYPE html>
<meta charset="utf-8">
<style>
  body {
    font-family: sans-serif;
    background: #f8f9fa;
  }
  .node rect {
    fill: #007bff;
    stroke: #333;
    stroke-width: 1px;
    rx: 8;
    ry: 8;
  }
  .node text {
    fill: white;
    font: 14px sans-serif;
  }
  .link {
    fill: none;
    stroke: #999;
    stroke-opacity: 0.6;
    stroke-width: 2px;
  }
</style>
<svg width="1000" height="800"></svg>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const data = {{DATA}};
const svg = d3.select("svg"),
      width = +svg.attr("width"),
      height = +svg.attr("height");

const g = svg.append("g").attr("transform", "translate(40,40)");
const root = d3.hierarchy(data);
const treeLayout = d3.tree().size([width - 100, height - 100]);
treeLayout(root);

g.selectAll(".link")
  .data(root.links())
  .enter().append("path")
  .attr("class", "link")
  .attr("d", d3.linkVertical()
      .x(d => d.x)
      .y(d => d.y));

const node = g.selectAll(".node")
  .data(root.descendants())
  .enter().append("g")
  .attr("class", "node")
  .attr("transform", d => `translate(${d.x},${d.y})`);

node.append("rect")
  .attr("x", -60)
  .attr("y", -20)
  .attr("width", 120)
  .attr("height", 40)
  .append("title")
  .text(d => d.data.title);

node.append("text")
  .attr("dy", 5)
  .style("text-anchor", "middle")
  .text(d => d.data.name);
</script>
