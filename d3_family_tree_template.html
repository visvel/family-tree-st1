<!DOCTYPE html>
<meta charset="utf-8">
<style>
    body {
        background-color: #1E2A38;
        color: white;
        font-family: sans-serif;
    }
    .node rect {
        fill: #AEDCF0;
        stroke: #999;
        stroke-width: 1.5px;
        rx: 10;
        ry: 10;
    }
    .node text {
        fill: white;
        font: 14px sans-serif;
    }
    .link {
        fill: none;
        stroke: #ccc;
        stroke-width: 2px;
    }
    .spouse rect {
        fill: #F9B4C1;
    }
</style>
<svg width="1000" height="800"></svg>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const data = {{DATA}};

const svg = d3.select("svg"),
    width = +svg.attr("width"),
    height = +svg.attr("height");

const g = svg.append("g").attr("transform", "translate(40,0)");

const tree = d3.tree().size([height - 200, width - 300]);
const stratify = d3.hierarchy(data, d => d.children);

tree(stratify);

const link = g.selectAll(".link")
    .data(stratify.links())
    .enter().append("path")
    .attr("class", "link")
    .attr("d", d3.linkVertical()
        .x(d => d.x)
        .y(d => d.y));

const node = g.selectAll(".node")
    .data(stratify.descendants())
    .enter().append("g")
    .attr("class", "node")
    .attr("transform", d => `translate(${d.x},${d.y})`);

node.append("rect")
    .attr("x", -60)
    .attr("y", -20)
    .attr("width", 120)
    .attr("height", 40)
    .append("title")
    .text(d => d.data.title);

node.append("text")
    .attr("dy", 5)
    .style("text-anchor", "middle")
    .text(d => d.data.name);
</script>
